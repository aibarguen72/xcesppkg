# /var/xcesp/cfg/xcespwdog.ini — container variant
#
# xcespwdog is PID 1 in the container.  It supervises xcespserver
# and one xcespproc (routing role — modem objects live under
# `routing`).  No PROC_CONFIG_FILE / xcesp-activate loop:
# processes are baked in below.

[WDOG]
LOG_CONSOLE_ENABLED     = true
LOG_CONSOLE_LEVEL       = Info
LOG_FILE_ENABLED        = true
LOG_FILE                = /var/xcesp/log/xcesp.log
LOG_FILE_LEVEL          = Info
LOG_LOCAL_PORT          = 1514

# xcespserver — no heartbeat, always running.
[process.1]
WDOG_LAUNCH             = /usr/bin/xcespserver --config /var/xcesp/cfg/xcespserver.ini
WDOG_START_TIMER        = 0
WDOG_INTERVAL_TIMER     = 0
WDOG_RESPAWN            = true
WDOG_RESPAWN_MAXCOUNT   = 3

# xcespproc — tdm-pw role, one instance (single modem per container).
#
# Why -r tdm-pw and not -r routing: XCespMap's kNodeTypeRole table
# assigns every object rooted under a `domain` config node
# (including `modem` children) to PROCESS_ROLE=tdm-pw with affinity
# offset 100.  Launching with -r routing here would make
# XCespCtrlServer::objectsForProc silently filter the modem out —
# role mismatch → no DEPLOY frame sent → xcespproc idles forever.
# Confirmed live via a container smoke that stalled after
# `SERVER_CAP received` with no `DEPLOY received: 1 object(s)
# deployed` follow-up until the role was flipped to tdm-pw.
#
# The -i 1 is fine (single-modem containers don't compete with
# other tdm-pw procs on the same host); production would use
# -i 101 with routing peers at -i 1/2 but that scaling is not
# relevant to a one-container-per-device topology.
#
# Timers match production (xcesp-activate) exactly:
#   START_TIMER = 90000 ms — allow up to 90 s for the first parent-
#     heartbeat to arrive.  xcespproc's heartbeat fires at the
#     `watchdogIntervalMs` cadence (default 10 s), not the `-s 60`
#     command-line value (which is the child-to-parent SIGRT interval
#     ceiling), so leaving this at 5 s the way an initial draft did
#     killed xcespproc before it ever emitted its first heartbeat.
#   INTERVAL_TIMER = 180000 ms — 180 s of missed heartbeats before
#     xcespwdog forces a respawn.
[process.2]
WDOG_LAUNCH             = /usr/bin/xcespproc --config /var/xcesp/cfg/xcespproc.ini -i 1 -r tdm-pw -s 60 -p 1514
WDOG_START_TIMER        = 90000
WDOG_INTERVAL_TIMER     = 180000
WDOG_RESPAWN            = true
WDOG_RESPAWN_MAXCOUNT   = 3
