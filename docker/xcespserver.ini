# /var/xcesp/cfg/xcespserver.ini — container variant
#
# Differences from the shipped systemd variant:
#  * WDOG_GEN_CONFIG absent — the container's xcespwdog.ini launches
#    xcespserver + xcespproc directly (there's no xcesp-activate stage
#    inside the container to regenerate the process list).
#  * DOC_HTTPD disabled — no python-http-server bundled in the image.
#
# LICENSE_ENFORCE stays TRUE (production posture).  A modem container
# needs no local licenses: no router/tdm-pw/pstn-rvp nodes live here,
# and modem clients themselves aren't license-gated — their slots are
# counted centrally at the RVP.  With no license-code lines in the
# generated xcespserver.conf, enforcement is effectively a no-op but
# xcespserver no longer prints the alarming "LICENSE ENFORCEMENT
# DISABLED (development/test mode)" warning that confused operators
# doing production deployments.

[SERVER]
SCHEMA_DIR           = /var/xcesp/schema
RULES_DIR            = /var/xcesp/rules
CONFIG_FILE          = /var/xcesp/cfg/xcespserver.conf
CONTROL_SOCKET       = /run/xcesp/ctrl.sock
CONTROL_ADDR         = 0.0.0.0
CONTROL_PORT         = 9900
DSK_DIR              = /var/xcesp/dsk

STATUS_POLL_INTERVAL = 30
HEARTBEAT_TIMEOUT    = 120
DEPLOY_BATCH_SIZE    = 100
LICENSE_ENFORCE      = true

MANAGED_USERS_FILE   = /var/lib/xcesp/managed-users.state
LOG_CONSOLE_ENABLED  = false
LOG_LOCAL_ENABLE     = true
LOG_LOCAL_PORT       = 1514

[DOC_HTTPD]
ENABLED              = false

[EVENTS]
DISPATCHER           = AUTO
MAX_EVENTS           = 10000
