#### XCESP installer — Debian 13 preseed (1.0.1)
#
# Used by the "Install XCESP" boot entry of the XCESP installer ISO
# (iso/build-iso.sh).  Unattended: ERASES THE FIRST DISK, installs Debian
# with the packages XCESP needs, then XCESP itself from /cdrom/xcesp
# (iso/late.sh).  The network is configured by DHCP during the install (the
# packages come from the Debian mirror); the management address is set at
# the first login (xcesp-setup).

# Locale, keyboard, time
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Network (DHCP during the install; xcesp-setup sets the management address)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string xcesp
d-i netcfg/get_domain string localdomain
d-i netcfg/hostname string xcesp
d-i hw-detect/load_firmware boolean true

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Accounts: no root login; administrator `xcespadmin` (sudo) with the
# initial password `xcesp`, which must be changed at the first login.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string XCESP administrator
d-i passwd/username string xcespadmin
d-i passwd/user-password password xcesp
d-i passwd/user-password-again password xcesp
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Disk: the whole first disk, one partition (+ swap, + EFI on UEFI).
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

# Packages: standard system + SSH, and the XCESP runtime packages.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo libsodium23 libsnmp40t64 libcrypt1 snmpd snmp python3 python3-venv frr strongswan-swanctl strongswan-charon iproute2 iptables procps libcap2-bin kmod isc-dhcp-client dnsmasq-base chrony hostapd wpasupplicant libopus0 libspandsp2t64 libspeexdsp1 tcpdump curl ca-certificates ethtool bridge-utils console-setup
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Boot loader on the first disk
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# XCESP itself, the first-login setup, then reboot.
d-i preseed/late_command string sh /cdrom/xcesp/late.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
